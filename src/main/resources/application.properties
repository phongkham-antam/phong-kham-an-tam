# 1. Cổng chạy trang web (Railway tự cấp cổng qua ${PORT}, máy phụ dùng 8085)
server.port=${PORT:8085}

# 2. Cấu hình kết nối MySQL
# - Nếu chạy trên Railway: Nó tự nhận ${MYSQLHOST}, ${MYSQLPORT}, ${MYSQLDATABASE}
# - Nếu chạy ở máy phụ (local): Nó tự động fallback về IP 192.168.1.68 và database phongkham của máy chính
spring.datasource.url=jdbc:mysql://${MYSQLHOST:192.168.1.68}:${MYSQLPORT:3306}/${MYSQLDATABASE:phongkham}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh

# 3. Tài khoản MySQL
# - Nếu chạy trên Railway: Lấy ${MYSQLUSER}
# - Nếu chạy ở máy phụ: Mặc định là root của máy chính
spring.datasource.username=${MYSQLUSER:root}

# 4. Mật khẩu MySQL
# - Nếu chạy trên Railway: Lấy ${MYSQLPASSWORD}
# - Nếu chạy ở máy phụ: Mặc định là 12345 của máy chính
spring.datasource.password=${MYSQLPASSWORD:12345}

# 5. Cấu hình Hibernate (Dùng chung cho cả 2)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update