# 1. Cổng chạy trang web (Railway tự cấp cổng qua ${PORT}, máy phụ dùng 8085)
server.port=${PORT:8085}

# 2. Cấu hình kết nối MySQL (Có fallback tự động sang IP máy chính khi chạy local)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:192.168.1.68}:${MYSQLPORT:3306}/${MYSQLDATABASE:phongkham}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

# 3. Tài khoản MySQL
spring.datasource.username=${MYSQLUSER:root}

# 4. Mật khẩu MySQL
spring.datasource.password=${MYSQLPASSWORD:12345}

# 5. Cấu hình Hibernate & JPA (Giữ nguyên logic cũ và bổ sung tối ưu)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update