# 1. Cổng chạy trang web
server.port=${PORT:8080}

# 2. Cấu hình kết nối MySQL (Ưu tiên lấy URL chuẩn của Railway, nếu không có mới dùng cấu hình local)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://192.168.1.68:3306/phongkham?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}

# 3. Tài khoản MySQL (Lấy từ Railway, nếu không có lấy root)
spring.datasource.username=${MYSQLUSER:root}

# 4. Mật khẩu MySQL (Lấy từ Railway, nếu không có lấy 12345)
spring.datasource.password=${MYSQLPASSWORD:12345}

# 5. Cấu hình Hibernate & JPA
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update