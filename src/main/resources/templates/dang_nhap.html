<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Bệnh Nhân - Phòng Khám Tâm An</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(12, 74, 110, 0.75), rgba(14, 165, 233, 0.65)), url('anh_dang_ky.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background-color: #0c4a6e;
            color: #ffffff;
            padding: 30px;
            text-align: center;
        }
        .medical-icon {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }
        .btn-medical {
            background-color: #0ea5e9;
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .btn-medical:hover {
            background-color: #0284c7;
            color: white;
            box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4);
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
        }
        .form-control:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }
        .input-group-text {
            background-color: #f8fafc;
            border-radius: 0 10px 10px 0 !important;
            cursor: pointer;
            color: #64748b;
        }
        .register-link {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link:hover {
            text-decoration: underline;
            color: #0284c7;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-card">
        
        <!-- Header -->
        <div class="login-header">
            <i class="fa-solid fa-user-injured medical-icon"></i>
            <h3 class="fw-bold mb-1">ĐĂNG NHẬP BỆNH NHÂN</h3>
            <p class="text-white-50 small mb-0">Phòng khám Tâm An - Chăm sóc sức khỏe toàn diện</p>
        </div>
        
        <!-- Form Body -->
        <div class="card-body p-4 p-sm-5">
            
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-exclamation me-2"></i>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <form action="/dang_nhap" method="POST" id="loginForm" onsubmit="return validateLogin()">
                
                <!-- Email / Tên đăng nhập -->
                <div class="mb-3">
                    <label class="form-label fw-medium text-secondary">Email hoặc ID <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="email" id="email" placeholder="Nhập email của bạn">
                    <div class="invalid-feedback">Vui lòng điền thông tin tài khoản hợp lệ.</div>
                </div>

                <!-- Mật khẩu -->
                <div class="mb-4">
                    <label class="form-label fw-medium text-secondary">Mật khẩu <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="password" class="form-control" name="password" id="password" placeholder="Nhập mật khẩu">
                        <span class="input-group-text" onclick="togglePassword()">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </span>
                        <div class="invalid-feedback">Vui lòng nhập mật khẩu (tối thiểu 6 ký tự).</div>
                    </div>
                </div>

                <!-- Nút Đăng nhập -->
                <button type="submit" class="btn btn-medical w-100 mb-3">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Đăng Nhập
                </button>

                <!-- Liên kết sang đăng ký bệnh nhân -->
                <div class="text-center mt-3">
                    <span class="text-muted small">Chưa có tài khoản bệnh nhân?</span>
                    <a href="/dang_ky" class="register-link small ms-1">Đăng ký ngay</a>
                </div>
            </form>
            
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.getElementById("toggleIcon");
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            toggleIcon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            passwordInput.type = "password";
            toggleIcon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function validateLogin() {
        let isValid = true;
        const email = document.getElementById("email");
        const password = document.getElementById("password");

        email.classList.remove("is-invalid");
        password.classList.remove("is-invalid");

        if (email.value.trim() === "") { email.classList.add("is-invalid"); isValid = false; }
        if (password.value.length < 6) { password.classList.add("is-invalid"); isValid = false; }

        return isValid;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
