<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Quản Lý Bác Sĩ - Phòng Khám Tâm An</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header Bác sĩ -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800" id="docDisplayName">BS. Nguyễn Văn A</h1>
                    <p class="text-xs text-slate-500">Chuyên khoa: <span id="docSpecialtyBadge" class="font-semibold text-emerald-600">Tim mạch</span></p>
                </div>
            </div>
            <button onclick="logoutDoctor()" class="px-4 py-2 text-xs font-semibold bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-100 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
            </button>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-6 space-y-6">
            
            <!-- Tiêu đề & Bộ lọc -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        📋 Danh Sách Ca Khám & Xử Lý Bệnh Án
                    </h2>
                    <p class="text-xs text-slate-500">Quản lý và cập nhật trạng thái lịch khám của bệnh nhân thuộc chuyên khoa.</p>
                </div>

                <!-- Bộ lọc trạng thái -->
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <select id="docStatusFilter" onchange="loadDoctorSchedule()" class="text-xs border border-slate-200 rounded-lg px-3 py-2 outline-none bg-slate-50 focus:ring-2 focus:ring-emerald-500">
                        <option value="ALL">Tất cả ca khám</option>
                        <option value="Chờ tiếp nhận">Chờ tiếp nhận</option>
                        <option value="Đã duyệt">Đã duyệt (Chờ khám)</option>
                        <option value="Đã khám">Đã hoàn thành</option>
                        <option value="Đã từ chối">Đã từ chối</option>
                    </select>
                    <button onclick="loadDoctorSchedule()" class="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-semibold hover:bg-emerald-100 transition">
                        🔄 Làm mới
                    </button>
                </div>
            </div>

            <!-- Bảng dữ liệu -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 uppercase font-bold">
                            <th class="py-3 px-4">Thời Gian</th>
                            <th class="py-3 px-4">Bệnh Nhân</th>
                            <th class="py-3 px-4">SĐT & CCCD</th>
                            <th class="py-3 px-4">Lý Do Khám</th>
                            <th class="py-3 px-4">Trạng Thái</th>
                            <th class="py-3 px-4 text-center">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="doctorBookingTable" class="divide-y divide-slate-100 text-sm">
                        <!-- Dữ liệu mẫu sẽ được JavaScript render vào đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL: KÊ ĐƠN THUỐC & LƯU Ý BỆNH ÁN -->
    <div id="prescriptionModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">💊 Kê Đơn Thuốc & Dặn Dò</h3>
                <button onclick="closePrescriptionModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>

            <div class="space-y-3">
                <input type="hidden" id="prescBookingId">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Bệnh nhân:</label>
                    <input type="text" id="prescPatientName" readonly class="w-full px-3 py-2 bg-slate-100 rounded-lg text-slate-700 font-medium text-sm border-0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Chẩn đoán bệnh:</label>
                    <input type="text" id="prescDiagnosis" placeholder="Ví dụ: Viêm họng cấp, Tăng huyết áp..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Chi tiết đơn thuốc (Tên thuốc - Liều lượng - Cách dùng):</label>
                    <textarea id="prescDetails" rows="3" placeholder="1. Paracetamol 500mg - Sáng 1v, Tối 1v&#10;2. Amoxicillin 500mg - Ngày 2v sau ăn..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Lời dặn / Lưu ý đặc biệt của Bác sĩ:</label>
                    <textarea id="prescNotes" rows="2" placeholder="Uống nhiều nước, kiêng đồ lạnh, tái khám sau 5 ngày..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>
            </div>

            <div class="flex gap-3 justify-end pt-3 border-t">
                <button onclick="closePrescriptionModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
                <button onclick="savePrescription()" class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow">Hoàn Thành & Lưu</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Mô Phỏng Hoạt Động -->
    <script>
        // Dữ liệu mẫu test giao diện (Giả lập dữ liệu lấy từ LocalStorage hoặc Database)
        let sampleBookings = [
            { id: "1", bookingTime: "08:30 - 09:00", name: "Trần Thị B", phone: "0912345678", cccd: "001205001234", specialty: "Tim mạch", reason: "Đau tức ngực, khó thở khi vận động mạnh", status: "Chờ tiếp nhận" },
            { id: "2", bookingTime: "09:00 - 09:30", name: "Lê Văn C", phone: "0987654321", cccd: "001205005678", specialty: "Tim mạch", reason: "Kiểm tra huyết áp định kỳ", status: "Đã duyệt" },
            { id: "3", bookingTime: "10:00 - 10:30", name: "Phạm Thị D", phone: "0905123456", cccd: "001205009999", specialty: "Nhi khoa", reason: "Sốt cao về đêm", status: "Chờ tiếp nhận" }
        ];

        // Khởi tạo dữ liệu mẫu vào LocalStorage nếu chưa có
        if (!localStorage.getItem('clinicBookings')) {
            localStorage.setItem('clinicBookings', JSON.stringify(sampleBookings));
        }

        // Khởi tạo thông tin bác sĩ giả định đang đăng nhập
        const currentDoctor = { name: "Nguyễn Văn A", specialty: "Tim mạch" };

        function loadDoctorSchedule() {
            document.getElementById('docDisplayName').textContent = `BS. ${currentDoctor.name}`;
            document.getElementById('docSpecialtyBadge').textContent = currentDoctor.specialty;

            let allBookings = JSON.parse(localStorage.getItem('clinicBookings')) || [];
            
            // 1. Chỉ lọc ra các lịch khám đúng chuyên khoa của bác sĩ
            let myBookings = allBookings.filter(b => b.specialty === currentDoctor.specialty);

            // 2. Lọc theo trạng thái ở thẻ Select
            const statusFilter = document.getElementById('docStatusFilter').value;
            if (statusFilter !== 'ALL') {
                myBookings = myBookings.filter(b => b.status === statusFilter);
            }

            const tbody = document.getElementById('doctorBookingTable');
            tbody.innerHTML = '';

            if (myBookings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Không có lịch khám nào phù hợp.</td></tr>`;
                return;
            }

            myBookings.forEach(item => {
                let badgeClass = "bg-amber-100 text-amber-700";
                if (item.status === 'Đã duyệt') badgeClass = "bg-blue-100 text-blue-700";
                if (item.status === 'Đã khám') badgeClass = "bg-emerald-100 text-emerald-700";
                if (item.status === 'Đã từ chối') badgeClass = "bg-rose-100 text-rose-700";

                let actionButtons = '';
                if (item.status === 'Chờ tiếp nhận') {
                    actionButtons = `
                        <button onclick="updateStatus('${item.id}', 'Đã duyệt')" class="px-2.5 py-1 text-[11px] bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm">Đồng ý</button>
                        <button onclick="updateStatus('${item.id}', 'Đã từ chối')" class="px-2.5 py-1 text-[11px] bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-lg shadow-sm">Từ chối</button>
                    `;
                } else if (item.status === 'Đã duyệt') {
                    actionButtons = `
                        <button onclick="openPrescriptionModal('${item.id}', '${item.name}')" class="px-2.5 py-1 text-[11px] bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-lg shadow-sm">Khám & Kê đơn</button>
                    `;
                } else {
                    actionButtons = `<span class="text-slate-400 italic">Đã hoàn tất</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-slate-700">${item.bookingTime}</td>
                    <td class="py-3 px-4 font-medium text-slate-900">${item.name}</td>
                    <td class="py-3 px-4 text-slate-600">${item.phone}<br><span class="text-[10px] text-slate-400">CCCD: ${item.cccd}</span></td>
                    <td class="py-3 px-4 text-slate-600">${item.reason}</td>
                    <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ${badgeClass}">${item.status}</span></td>
                    <td class="py-3 px-4 text-center space-x-1">${actionButtons}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatus(id, newStatus) {
            let allBookings = JSON.parse(localStorage.getItem('clinicBookings')) || [];
            const index = allBookings.findIndex(b => b.id === id);
            if (index !== -1) {
                allBookings[index].status = newStatus;
                localStorage.setItem('clinicBookings', JSON.stringify(allBookings));
                loadDoctorSchedule();
                alert(`✅ Đã cập nhật trạng thái thành: ${newStatus}`);
            }
        }

        function openPrescriptionModal(id, name) {
            document.getElementById('prescBookingId').value = id;
            document.getElementById('prescPatientName').value = name;
            document.getElementById('prescriptionModal').classList.remove('hidden');
        }

        function closePrescriptionModal() {
            document.getElementById('prescriptionModal').classList.add('hidden');
        }

        function savePrescription() {
            const id = document.getElementById('prescBookingId').value;
            const diagnosis = document.getElementById('prescDiagnosis').value;
            const details = document.getElementById('prescDetails').value;

            if (!diagnosis || !details) {
                alert("Vui lòng nhập chẩn đoán và chi tiết đơn thuốc!");
                return;
            }

            // Cập nhật trạng thái thành "Đã khám"
            let allBookings = JSON.parse(localStorage.getItem('clinicBookings')) || [];
            const index = allBookings.findIndex(b => b.id === id);
            if (index !== -1) {
                allBookings[index].status = 'Đã khám';
                allBookings[index].prescription = { diagnosis, details };
                localStorage.setItem('clinicBookings', JSON.stringify(allBookings));
            }

            closePrescriptionModal();
            loadDoctorSchedule();
            alert("🎉 Đã lưu đơn thuốc và hoàn thành ca khám!");
        }

        function logoutDoctor() {
            alert("Đã đăng xuất tài khoản bác sĩ!");
            location.reload();
        }

        // Tải danh sách khi vừa mở trang
        window.onload = loadDoctorSchedule;
    </script>
</body>
</html>
